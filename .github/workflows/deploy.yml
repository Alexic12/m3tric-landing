name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this manual deploy
        type: string
        required: true

permissions:
  contents: read

# One deploy or rollback at a time, never cancelling one in flight (a cancelled CloudFormation/S3 pass leaves
# a half-published site). A newer pending run replaces an older pending one: only the latest main matters.
concurrency:
  group: landing-staging
  cancel-in-progress: false

env:
  NODE_VERSION: 24.19.0
  STACK_NAME: m3tric-staging-LandingSiteStack

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # Runs the dependency install (with its lifecycle scripts) and the CDK app WITHOUT AWS credentials and
  # without an OIDC token: no environment, no id-token permission (audit M1). Hands the cloud assembly
  # to the deploy job as an artifact, plus a sha256 list of every file in it.
  synth:
    name: CDK synth
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      sums_sha256: ${{ steps.sums.outputs.sha256 }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release id
        id: meta
        run: echo "release_id=deploy-${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - run: npm ci

      # Same command CI runs; cdk-nag fails it on any unacknowledged finding.
      - name: cdk synth
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: npx cdk synth --lookups=false -c env=staging -c gitSha="$GITHUB_SHA" -c releaseId="$RELEASE_ID" --quiet

      - name: Hash the cloud assembly
        id: sums
        run: |
          set -euo pipefail
          (cd cdk.out && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > cdk-out.sha256
          echo "sha256=$(sha256sum cdk-out.sha256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the cloud assembly
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-out-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            infra/cdk.out/
            infra/cdk-out.sha256
          if-no-files-found: error
          retention-days: 1

  # Holds the OIDC token but runs no dependency code except the pinned CDK CLI itself, installed with
  # --ignore-scripts from the lockfile (integrity-checked). Deploys the pre-synthesized assembly: the CLI
  # stages the template in the landing's own assets bucket and creates a change set that CloudFormation
  # executes as the scoped execution role (no IAM permissions). No shared bootstrap role is involved.
  infra:
    name: CDK deploy
    needs: synth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: landing-staging
    permissions:
      id-token: write
      contents: read
    outputs:
      bucket: ${{ steps.outputs.outputs.bucket }}
      distribution_id: ${{ steps.outputs.outputs.distribution_id }}
      site_url: ${{ steps.outputs.outputs.site_url }}
      release_id: ${{ needs.synth.outputs.release_id }}
      # Environment variables are only readable in a job that declares the environment; the build job in
      # publish.yml deliberately does not, so they travel as inputs.
      platform_url: ${{ vars.PLATFORM_URL }}
      contact_email: ${{ vars.CONTACT_EMAIL }}
      contact_phone: ${{ vars.CONTACT_PHONE }}
    env:
      CFN_EXEC_ROLE_ARN: ${{ vars.AWS_CFN_EXEC_ROLE_ARN }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Check the execution role variable
        working-directory: .
        run: |
          set -euo pipefail
          printf '%s' "$CFN_EXEC_ROLE_ARN" | grep -Eq '^arn:aws:iam::[0-9]{12}:role/m3tric/delivery/m3tric-staging-landing-cfn-exec$' \
            || { echo "::error::vars.AWS_CFN_EXEC_ROLE_ARN must be the CfnExecRoleArn output of the identity stack"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # By id, not by name: only the artifact the synth job uploaded, whose digest the action verifies.
      - name: Download the cloud assembly
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.synth.outputs.artifact_id }}
          path: infra
          digest-mismatch: error

      - name: Verify the cloud assembly against the synth job's hashes
        env:
          EXPECTED_SUMS_SHA256: ${{ needs.synth.outputs.sums_sha256 }}
        run: |
          set -euo pipefail
          printf '%s  cdk-out.sha256\n' "$EXPECTED_SUMS_SHA256" | sha256sum --check --strict --quiet -
          (cd cdk.out && sha256sum --check --strict --quiet ../cdk-out.sha256)
          # --check ignores files that are not listed; an extra file must fail too.
          diff <(cd cdk.out && find . -type f -print | LC_ALL=C sort) <(sed -E 's/^[0-9a-f]{64}  //' cdk-out.sha256 | LC_ALL=C sort) \
            || { echo "::error::cdk.out holds files the synth job did not hash"; exit 1; }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Only to get the pinned aws-cdk CLI. Residual risk: the CLI package itself runs with the role
      # (as any deploy tool would); no other package's code runs, and no lifecycle script runs at all.
      - name: Install the pinned CDK CLI (no lifecycle scripts)
        run: npm ci --ignore-scripts

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: landing-cdk-${{ github.run_id }}

      # --role-arn is mandatory: the deploy role may only create change sets that run as this role
      # (IAM condition cloudformation:RoleArn), and --method=change-set is the only path it can use.
      - name: cdk deploy
        run: >
          npx cdk deploy "$STACK_NAME" --app cdk.out --exclusively
          --role-arn "$CFN_EXEC_ROLE_ARN" --method=change-set
          --require-approval never --no-notices --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          out() { jq -er --arg k "$1" '.[env.STACK_NAME][$k] | select(. != null and . != "")' cdk-outputs.json; }
          site_url="$(out SiteUrl)"
          case "$site_url" in https://*) ;; *) echo "::error::SiteUrl is not https: $site_url"; exit 1 ;; esac
          {
            echo "bucket=$(out SiteBucketName)"
            echo "distribution_id=$(out DistributionId)"
            echo "site_url=${site_url%/}"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: infra
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      bucket: ${{ needs.infra.outputs.bucket }}
      distribution_id: ${{ needs.infra.outputs.distribution_id }}
      site_url: ${{ needs.infra.outputs.site_url }}
      release_id: ${{ needs.infra.outputs.release_id }}
      platform_url: ${{ needs.infra.outputs.platform_url }}
      contact_email: ${{ needs.infra.outputs.contact_email }}
      contact_phone: ${{ needs.infra.outputs.contact_phone }}
      reason: ${{ github.event_name == 'workflow_dispatch' && inputs.reason || format('push to {0}', github.ref_name) }}
